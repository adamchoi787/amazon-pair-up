<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceMarket Live</title>
<!-- Owner: C. Judge-facing view of the marketplace. Polls /api/dashboard. Private limits are never sent here. -->
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e4e4df; --accent:#0a7cff; --ok:#1a8f4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ededea; --muted:#9a9a94; --card:#1e1e1c; --line:#2e2e2b; --accent:#4da3ff; --ok:#4cc27e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { padding:20px 16px 8px; max-width:1200px; margin:auto; }
  h1 { margin:0; font-size:22px; } header p { margin:4px 0 0; color:var(--muted); }
  main { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); padding:16px; max-width:1200px; margin:auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
  h2 { margin:0 0 10px; font-size:15px; }
  ul { list-style:none; margin:0; padding:0; max-height:420px; overflow:auto; }
  li { padding:8px 0; border-top:1px solid var(--line); } li:first-child { border-top:0; }
  .muted { color:var(--muted); font-size:12px; } .price { font-weight:600; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:99px; border:1px solid var(--line); margin-left:6px; }
  .confirmed { color:var(--ok); border-color:var(--ok); } .lock { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VoiceMarket live</h1>
  <p>Everything Alexa+ does through the MCP server. <span class="lock">🔒 Private limits never leave the server.</span></p>
</header>
<main>
  <section><h2>Deals</h2><ul id="deals"></ul></section>
  <section><h2>Buy requests</h2><ul id="intents"></ul></section>
  <section><h2>Listings</h2><ul id="listings"></ul></section>
  <section><h2>Agent activity</h2><ul id="events"></ul></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const money = (v, c) => (c === "USD" ? "$" : c + " ") + Number(v).toFixed(Number(v) % 1 ? 2 : 0);
const time = (t) => new Date(t).toLocaleTimeString();
async function refresh() {
  try {
    const d = await (await fetch("/api/dashboard")).json();
    $("deals").innerHTML = d.deals.map((x) => `<li><span class="price">${money(x.price, x.currency)}</span> ${esc(x.title)}
      <span class="tag ${x.status}">${esc(x.status)}</span><div class="muted">buyer ${esc(x.buyer_id)} · seller ${esc(x.seller_id)} · ${esc(x.meetup ?? "")}</div></li>`).join("") || "<li class=muted>No deals yet</li>";
    $("intents").innerHTML = d.intents.map((x) => `<li>${esc(x.need)} <span class="tag">${esc(x.source)}</span> <span class="tag">${esc(x.status)}</span>
      <div class="muted">${esc(x.buyer_id)} · budget <span class="lock">🔒</span> · ${time(x.created_at)}</div></li>`).join("") || "<li class=muted>None</li>";
    $("listings").innerHTML = d.listings.map((x) => `<li>${esc(x.title)} <span class="price">${money(x.ask_price, x.currency)}</span> <span class="tag">${esc(x.status)}</span>
      <div class="muted">${esc(x.seller_id)} · ${esc(x.condition)} · ${esc(x.location ?? "")} · reserve <span class="lock">🔒</span></div></li>`).join("");
    $("events").innerHTML = d.events.map((x) => `<li>${esc(x.kind.replaceAll("_", " "))}<div class="muted">${esc(x.actor_id)} · ${time(x.created_at)} · ${esc(JSON.stringify(x.detail))}</div></li>`).join("");
  } catch (e) { console.error(e); }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
