<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoiceMarket</title>
<meta name="description" content="Buy and sell with people nearby, by voice.">
<link rel="icon" href="/addon/icon-64.png">
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --fg: #15171a; --muted: #5d6470; --line: #e3e6ea;
    --accent: #0b6bcb; --accent-fg: #ffffff; --user: #0b6bcb; --user-fg: #ffffff; --danger: #c62828;
    --radius: 18px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10; --surface: #14171b; --fg: #eef0f3; --muted: #9aa3ae; --line: #252a31;
      --accent: #4ea1ff; --accent-fg: #06121f; --user: #2a6fdb; --user-fg: #ffffff; --danger: #ff6b6b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* sign-in */
  #signin { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .welcome { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; max-width: 420px; width: 100%; }
  .welcome h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.01em; }
  .welcome p { color: var(--muted); margin: 0 0 18px; }
  .welcome input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; margin: 6px 0 12px; }
  .primary { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 650; }
  .error { color: var(--danger); min-height: 1.4em; }

  /* app frame */
  #app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
  .brand { font-weight: 750; font-size: 20px; letter-spacing: -.01em; margin-right: auto; }
  .brand small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .ghost { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; min-height: 40px; }
  .ghost[aria-pressed="false"] { color: var(--muted); }
  nav { display: flex; gap: 6px; padding: 0 16px 8px; }
  nav button { position: relative; border: 0; background: transparent; color: var(--muted); padding: 10px 14px; border-radius: 999px; font-weight: 600; min-height: 44px; }
  nav button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  .badge { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; line-height: 20px; padding: 0 6px; }

  main { overflow: hidden; display: flex; flex-direction: column; }
  #panel-assistant { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .panel { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
  .turn { display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 82%; padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.assistant { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; font-size: 18px; }
  .bubble.user { background: var(--user); color: var(--user-fg); align-self: flex-end; }
  .bubble.note { align-self: center; color: var(--muted); font-size: 14px; background: transparent; }
  .bubble.pending { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .card-slot { width: 100%; }
  .card-slot.loading, .panel.loading { min-height: 120px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); animation: pulse 1.2s ease-in-out infinite; }
  iframe.view { width: 100%; border: 0; display: block; border-radius: var(--radius); background: transparent; transition: height .15s ease; }
  #suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px; }
  #suggestions .chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; min-height: 40px; text-align: left; }

  /* composer */
  #composer { display: flex; gap: 10px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  #composer input { flex: 1; min-width: 0; min-height: 52px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; font-size: 17px; }
  #mic { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); flex: none; display: grid; place-items: center; }
  #mic svg { width: 26px; height: 26px; }
  #mic.listening { background: var(--danger); color: #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 25%, transparent); }
  #send { min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; }
  #composer.busy input { opacity: .6; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) { .bubble { max-width: 92%; } #send { display: none; } }
</style>
</head>
<body>
<section id="signin" hidden>
  <div class="welcome">
    <h1>VoiceMarket</h1>
    <p>Buy and sell with people nearby, just by talking. Your private price limits are never shown to anyone.</p>
    <button id="signin-oauth" class="primary" type="button" hidden>Sign in</button>
    <form id="signin-local" hidden>
      <label for="signin-name">Your name</label>
      <input id="signin-name" autocomplete="name" maxlength="40" required>
      <button class="primary" type="submit">Continue</button>
    </form>
    <p class="error" id="signin-error" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div class="brand">VoiceMarket <small><span id="who"></span> · <span id="mode"></span></small></div>
    <button id="voice" class="ghost" type="button" aria-pressed="true">Voice on</button>
    <button id="signout" class="ghost" type="button">Sign out</button>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="assistant" aria-selected="true" type="button">Assistant</button>
    <button role="tab" data-tab="deals" aria-selected="false" type="button">Deals <span id="deals-badge" class="badge" hidden>0</span></button>
    <button role="tab" data-tab="posts" aria-selected="false" type="button">My posts</button>
  </nav>
  <main>
    <section id="panel-assistant" role="tabpanel">
      <div id="log" aria-live="polite"></div>
      <div id="suggestions"></div>
    </section>
    <section id="panel-deals" class="panel" role="tabpanel" hidden></section>
    <section id="panel-posts" class="panel" role="tabpanel" hidden></section>
  </main>
  <form id="composer" autocomplete="off">
    <button id="mic" type="button" aria-label="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="text" placeholder="Say or type: sell my TI-84 for $20…" aria-label="Message">
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script type="module" src="/app/app.js"></script>
</body>
</html>
