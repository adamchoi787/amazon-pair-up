<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PairUp Watch</title>
<link rel="icon" href="/addon/icon-64.png">
<link rel="stylesheet" href="/design/tokens.css">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh; display: grid; place-items: center; gap: var(--space-5); padding: var(--space-8) var(--space-4);
  background: radial-gradient(700px 420px at 50% 30%, var(--accent-soft), transparent 70%), var(--bg); color: var(--fg);
  font: var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans); -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
.icon, .mark { flex: none; display: block; }
.stage { display: flex; flex-direction: column; align-items: center; gap: var(--space-5); }
/* The watch face is always dark, like the device. */
.watch {
  position: relative; width: 400px; height: 500px; border-radius: 76px; padding: 12px;
  background: linear-gradient(145deg, #4a4954, #1d1c22 60%, #34333c); box-shadow: var(--shadow-3), inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.watch::before, .watch::after {
  content: ""; position: absolute; left: calc(50% - 105px); width: 210px; height: 74px; z-index: -1;
  background: linear-gradient(90deg, #2b2a31, #3b3a43 50%, #2b2a31);
}
.watch::before { top: -66px; border-radius: 26px 26px 6px 6px; }
.watch::after { bottom: -66px; border-radius: 6px 6px 26px 26px; }
.crown { position: absolute; right: -9px; top: 120px; width: 12px; height: 54px; border-radius: 6px; background: linear-gradient(90deg, #5a5964, #2a2930); }
.screen {
  height: 100%; border-radius: 64px; background: #000; color: var(--fg); overflow: hidden;
  display: flex; flex-direction: column; gap: var(--space-3); padding: 30px 26px 28px;
}
header { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; }
header a { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--fg); text-decoration: none; font-family: var(--font-display); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
header .time { margin-left: auto; color: var(--fg-muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); }
.icon-btn {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface-2); color: var(--fg-muted); transition: transform var(--dur-instant) var(--ease-out), color var(--dur-fast);
}
.icon-btn:hover { color: var(--fg); }
.icon-btn:active { transform: scale(.92); }
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--space-2); }
#message {
  flex: 1; min-height: 70px; margin: 0; overflow: auto; overflow-wrap: anywhere;
  font-family: var(--font-display); font-size: 23px; line-height: 1.25; font-weight: var(--weight-semibold); letter-spacing: -0.01em;
}
#message.swap { animation: swap var(--dur-slow) var(--ease-out); }
@keyframes swap { from { opacity: 0; transform: translateY(var(--rise)); filter: blur(2px); } }
button.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 52px; padding: 0 var(--space-5);
  border: 0; border-radius: var(--radius-pill); cursor: pointer; font-weight: var(--weight-semibold);
  background: var(--surface-2); color: var(--fg); transition: transform var(--dur-instant) var(--ease-out), background-color var(--dur-fast);
}
button.pill:active:not(:disabled) { transform: scale(.96); }
button:disabled { opacity: .5; cursor: progress; }
#actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); animation: swap var(--dur-slow) var(--ease-out); }
#yes { background: var(--accent); color: var(--accent-fg); font-size: var(--text-xl); min-height: 58px; box-shadow: var(--glow); }
#no { font-size: var(--text-xl); min-height: 58px; }
#mic { position: relative; width: 100%; min-height: 48px; }
#mic .icon { color: var(--accent); }
#mic.listening { background: var(--danger); color: var(--danger-fg); }
#mic.listening .icon { color: var(--danger-fg); }
#mic.listening::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--danger); animation: ripple 1.4s var(--ease-out) infinite; }
@keyframes ripple { from { transform: scale(1); opacity: .5; } to { transform: scale(1.12, 1.4); opacity: 0; } }
input {
  min-width: 0; width: 100%; min-height: 48px; padding: 0 var(--space-4); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-pill);
}
input::placeholder { color: var(--fg-muted); }
form { display: flex; gap: var(--space-2); }
form .icon-btn { flex: none; width: 48px; height: 48px; background: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
#signin h1 { font-family: var(--font-display); font-size: var(--text-xl); letter-spacing: var(--tracking-tight); margin: var(--space-2) 0; }
#signin p { line-height: var(--leading-normal); color: var(--fg-muted); }
#signin a { color: var(--accent); }
.caption { margin: 64px 0 0; max-width: 400px; text-align: center; color: var(--fg-muted); font-size: var(--text-sm); }
.caption strong { color: var(--fg); }
@media (max-width: 440px) {
  body { padding: 0; display: block; background: #000; }
  .stage { gap: 0; }
  .watch { width: 100%; height: auto; min-height: 100dvh; border-radius: 0; padding: 0; background: #000; box-shadow: none; }
  .watch::before, .watch::after, .crown { display: none; }
  .screen { min-height: 100dvh; border-radius: 0; padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  #message { min-height: 120px; font-size: 26px; }
  .caption { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style></head><body>
<main class="stage">
  <div class="watch theme-dark">
    <span class="crown" aria-hidden="true"></span>
    <div class="screen">
      <header><a href="/app/" data-mark="26">PairUp</a><span class="time" id="clock" aria-hidden="true"></span><button id="refresh" class="icon-btn" type="button" aria-label="Refresh" title="Refresh"><span data-icon="refresh"></span></button></header>
      <section id="signin" hidden><h1>PairUp on your watch</h1><p><a href="/app/">Sign in to PairUp</a>, then return here.</p><form id="local" hidden><input id="name" aria-label="Your name" placeholder="Your name" required maxlength="40"><button class="icon-btn" aria-label="Sign in"><span data-icon="right"></span></button></form></section>
      <section id="screen"><p id="message" role="status" aria-live="polite">Connecting…</p><input id="budget" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" placeholder="Your maximum budget" aria-label="Your maximum budget" hidden><div id="actions" hidden><button id="yes" class="pill" type="button"><span data-icon="check"></span>Yes</button><button id="no" class="pill" type="button">No</button></div><button id="mic" class="pill" type="button"><span data-icon="mic"></span>Talk to PairUp</button><form id="words"><input id="text" aria-label="Message" placeholder="Or type here" required><button class="icon-btn" aria-label="Send"><span data-icon="send"></span></button></form></section>
    </div>
  </div>
  <p class="caption"><strong>Watch preview.</strong> For Apple Watch, create the Siri Shortcut in the app’s Devices panel.</p>
</main><script type="module" src="/watch/watch.js"></script></body></html>
