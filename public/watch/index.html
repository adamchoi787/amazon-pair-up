<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PairUp Watch</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;color:#f3f6f4;background:#171b1a}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100dvh;display:grid;place-items:center}.watch{width:min(410px,100vw);min-height:502px;background:#050807;border-radius:72px;padding:40px 28px;display:flex;flex-direction:column;gap:14px}header{display:flex;justify-content:space-between;align-items:center;color:#9ce8bd;font-weight:650}a{color:#9ce8bd}button,input{font:inherit}button{min-height:48px;border:0;border-radius:24px;padding:12px 20px;background:#25382e;color:#f3f6f4;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9ce8bd;outline-offset:3px}#refresh{font-size:14px;background:transparent;padding:8px;min-height:44px}#message{font-size:25px;line-height:1.3;min-height:132px;overflow-wrap:anywhere;margin:10px 0}#actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}#yes{background:#9ce8bd;color:#072013;font-size:23px}#no{font-size:23px}#mic{width:100%;font-size:18px}input{min-width:0;width:100%;padding:12px;color:inherit;background:#19211d;border:1px solid #52655a;border-radius:16px}form{display:flex;gap:6px}#screen{display:flex;flex-direction:column;gap:10px}.hint{color:#a4b6ab;font-size:13px;margin:0}#signin p{line-height:1.5} @media(min-width:600px){.watch{border:12px solid #6a716c;box-shadow:0 0 0 4px #252b27,0 24px 60px #0008;position:relative}.watch:before,.watch:after{content:"";position:absolute;width:220px;height:60px;background:#303c34;left:calc(50% - 110px);z-index:-1}.watch:before{top:-70px}.watch:after{bottom:-70px}} @media(max-width:410px){.watch{border-radius:42px;padding:24px 20px;min-height:100dvh}#message{font-size:23px}}
</style></head><body><main class="watch"><header><a href="/app/">PairUp</a><button id="refresh" type="button">Refresh</button></header>
<section id="signin" hidden><h1>PairUp on your watch</h1><p><a href="/app/">Sign in to PairUp</a>, then return here.</p><form id="local" hidden><input id="name" aria-label="Your name" placeholder="Your name" required maxlength="40"><button>Sign in</button></form></section>
<section id="screen"><p id="message" role="status" aria-live="polite">Connecting…</p><input id="budget" type="number" min="0.01" max="100000" step="0.01" placeholder="Your maximum budget" aria-label="Your maximum budget" hidden><div id="actions" hidden><button id="yes" type="button">Yes</button><button id="no" type="button">No</button></div><button id="mic" type="button">Talk to PairUp</button><form id="words"><input id="text" aria-label="Message" placeholder="Or type here" required><button>Send</button></form><p class="hint">For Apple Watch, create the Siri Shortcut in the app’s Devices panel.</p></section>
</main><script type="module" src="/watch/watch.js"></script></body></html>
