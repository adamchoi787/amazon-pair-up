AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VoiceMarket: one Graviton EC2 instance (Node 22, embedded Postgres + pgvector on an
  encrypted EBS volume with daily snapshots) behind CloudFront for HTTPS. Bedrock access
  through an IAM role, deploys through Systems Manager; no SSH, no access keys.
  Deploy with deploy/aws/deploy.sh.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Sent by CloudFront as X-Origin-Verify; the app rejects requests without it.
  AppPort:
    Type: Number
    Default: 8080

Conditions:
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  # ---------- release artifacts ----------
  ReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-releases
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 30

  # ---------- instance identity ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: voicemarket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v2:0
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*
              - Sid: Releases
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ReleaseBucket.Arn}/releases/*
              - Sid: Secrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/voicemarket/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------- network ----------
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VoiceMarket app port (CloudFront adds a secret header the app checks)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIpv6: ::/0

  # ---------- the server ----------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!GetAtt AppSecurityGroup.GroupId]
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 20
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: voicemarket }]
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: voicemarket-data }
              - { Key: voicemarket-backup, Value: daily }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Base image: Node.js 22 (checksum-verified), a service user, and the systemd unit.
            # The app itself is installed and updated by deploy/aws/deploy.sh through SSM.
            set -euxo pipefail
            dnf -y install tar xz
            cd /tmp
            curl -fsSLO https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt
            TARBALL=$(grep -oE 'node-v22\.[0-9]+\.[0-9]+-linux-arm64\.tar\.xz' SHASUMS256.txt | head -1)
            curl -fsSLO "https://nodejs.org/dist/latest-v22.x/$TARBALL"
            grep " $TARBALL\$" SHASUMS256.txt | sha256sum -c -
            tar -xJf "$TARBALL" -C /usr/local --strip-components=1
            useradd --system --home-dir /var/lib/voicemarket --shell /sbin/nologin voicemarket || true
            install -d -o voicemarket -g voicemarket -m 750 /var/lib/voicemarket
            install -d -m 755 /opt/voicemarket/releases
            cat > /etc/systemd/system/voicemarket.service <<'UNIT'
            [Unit]
            Description=VoiceMarket
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=voicemarket
            Group=voicemarket
            WorkingDirectory=/opt/voicemarket/current
            EnvironmentFile=/etc/voicemarket.env
            ExecStart=/usr/local/bin/node --import tsx src/index.ts
            Restart=always
            RestartSec=3
            TimeoutStopSec=20
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            PrivateTmp=true
            ReadWritePaths=/var/lib/voicemarket

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            echo "voicemarket base image ready (port ${AppPort})"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

  # Replaces the instance on the same EIP and volume if the underlying host fails.
  RecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the VoiceMarket instance when the host fails its status check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover"]

  # ---------- backups ----------
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: VoiceMarket daily EBS snapshots, kept for 7 days
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: voicemarket-backup, Value: daily }]
        Schedules:
          - Name: daily
            CopyTags: true
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["18:00"] }
            RetainRule: { Count: 7 }

  # ---------- HTTPS at the edge ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: VoiceMarket
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: app
            DomainName: !If
              - IsUsEast1
              - !Sub ["ec2-${Dashed}.compute-1.amazonaws.com", { Dashed: !Join ["-", !Split [".", !Ref ElasticIp]] }]
              - !Sub ["ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com", { Dashed: !Join ["-", !Split [".", !Ref ElasticIp]] }]
            CustomOriginConfig:
              HTTPPort: !Ref AppPort
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingDisabled, AllViewerExceptHostHeader, SecurityHeadersPolicy
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}/app/
  PublicBaseUrl:
    Value: !Sub https://${Distribution.DomainName}
  OriginHost:
    Value: !If
      - IsUsEast1
      - !Sub ["ec2-${Dashed}.compute-1.amazonaws.com", { Dashed: !Join ["-", !Split [".", !Ref ElasticIp]] }]
      - !Sub ["ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com", { Dashed: !Join ["-", !Split [".", !Ref ElasticIp]] }]
  InstanceId:
    Value: !Ref Instance
  ReleaseBucket:
    Value: !Ref ReleaseBucket
  AppPort:
    Value: !Ref AppPort
